version: '3.8'

services:
  # Message Broker para comunicación asincrónica (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # RabbitMQ port
      - "15672:15672" # Management Console
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - banking-network

  # Base de Datos para Microservicio de Clientes
  db-clientes:
    image: postgres:15
    environment:
      POSTGRES_DB: db_clientes
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432" # Expuesto en 5433 para evitar conflicto si hay otro Postgres local
    volumes:
      - ./BaseDatos.sql:/docker-entrypoint-initdb.d/BaseDatos.sql
    networks:
      - banking-network

  # Microservicio de Clientes (MS1)
  ms-clientes:
    build:
      context: ./cliente-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-clientes:5432/db_clientes
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - db-clientes
      - rabbitmq
    networks:
      - banking-network

networks:
  banking-network:
    driver: bridge
